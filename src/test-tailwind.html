<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tailwind Test</title>
    <link rel="stylesheet" href="./index.css">
</head>
<body>
    <div class="bg-red-500 text-white p-4 m-4 rounded-lg">
        <h1 class="text-2xl font-bold">Tailwind Test</h1>
        <p class="text-sm">If you can see this with red background, Tailwind is working!</p>
        <button class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded mt-2">
            Test Button
        </button>
    </div>
    
    <div class="bg-primary-500 text-white p-4 m-4 rounded-lg">
        <h2 class="text-xl font-semibold">Custom Colors Test</h2>
        <p>This should have your custom primary color background</p>
    </div>
    
    <div class="bg-neutral-900 text-neutral-100 p-4 m-4 rounded-lg">
        <h2 class="text-xl font-semibold">Custom Neutral Colors</h2>
        <p>This should have your custom neutral colors</p>
    </div>
</body>
</html>
